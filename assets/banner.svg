<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Mesh Wireframe Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -15px); opacity: 0.65; }
    }

    @keyframes rotateWireframe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes dashGrid {
      to { stroke-dashoffset: -40; }
    }

    .anim-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 950px 180px;
    }

    .anim-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 200px 300px;
    }

    .anim-wireframe {
      animation: rotateWireframe 40s linear infinite;
      transform-origin: 1000px 210px;
    }

    .pill-float-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }

    .pill-float-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }

    .grid-lines {
      stroke-dasharray: 6 6;
      animation: dashGrid 25s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Glows -->
  <g class="anim-orb-1">
    <circle cx="980" cy="190" r="170" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
    <circle cx="1040" cy="230" r="110" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  </g>
  <g class="anim-orb-2">
    <circle cx="160" cy="280" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />
  </g>

  <!-- Perspective Isometric 3D Sculpt Grid (Subtle Dynamic Background) -->
  <g opacity="0.12" stroke="#a855f7" stroke-width="1.2" class="grid-lines">
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="600" y1="340" x2="0" y2="420" />
    <line x1="600" y1="340" x2="300" y2="420" />
    <line x1="600" y1="340" x2="600" y2="420" />
    <line x1="600" y1="340" x2="900" y2="420" />
    <line x1="600" y1="340" x2="1200" y2="420" />
  </g>

  <!-- Dynamic 3D Wireframe Polyhedron / Sculpt Mesh Element in Background Right -->
  <g class="anim-wireframe" opacity="0.75">
    <!-- Outer 3D Icosahedron Cage -->
    <polygon points="1000,70 1090,140 1090,260 1000,330 910,260 910,140" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" filter="url(#subtleGlow)" />
    <polygon points="1000,110 1060,160 1060,240 1000,290 940,240 940,160" fill="rgba(99, 102, 241, 0.05)" stroke="#06b6d4" stroke-width="1.4" />
    <line x1="1000" y1="70" x2="1000" y2="110" stroke="#a855f7" stroke-width="1.2" />
    <line x1="1090" y1="140" x2="1060" y2="160" stroke="#a855f7" stroke-width="1.2" />
    <line x1="1090" y1="260" x2="1060" y2="240" stroke="#a855f7" stroke-width="1.2" />
    <line x1="1000" y1="330" x2="1000" y2="290" stroke="#a855f7" stroke-width="1.2" />
    <line x1="910" y1="260" x2="940" y2="240" stroke="#a855f7" stroke-width="1.2" />
    <line x1="910" y1="140" x2="940" y2="160" stroke="#a855f7" stroke-width="1.2" />
    <!-- Dynamic Sculpt Nodes / Vertices -->
    <circle cx="1000" cy="70" r="4" fill="#ec4899" />
    <circle cx="1090" cy="140" r="4" fill="#8b5cf6" />
    <circle cx="1090" cy="260" r="4" fill="#06b6d4" />
    <circle cx="1000" cy="330" r="4" fill="#ec4899" />
    <circle cx="910" cy="260" r="4" fill="#8b5cf6" />
    <circle cx="910" cy="140" r="4" fill="#06b6d4" />
    <circle cx="1000" cy="200" r="7" fill="url(#accentGrad)" filter="url(#glow)" />
    <!-- Cross Struts -->
    <line x1="1000" y1="200" x2="1000" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="1000" y1="200" x2="1090" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="1000" y1="200" x2="1090" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="1000" y1="200" x2="1000" y2="330" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="1000" y1="200" x2="910" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="1000" y1="200" x2="910" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>

  <!-- Foreground Content: Title, Subtitle, Badges (Crisp, High Contrast, Layered on Top) -->
  <g transform="translate(70, 70)">
    <!-- Category Pill Tag -->
    <g class="pill-float-1">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="1.2" />
      <text x="16" y="21" class="badge-text" fill="#a5b4fc">✨ CURATED 3D ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text">Awesome 3D Sculpting &amp;</text>
    <text x="0" y="145" class="title-text" fill="url(#accentGrad)">Modeling Software 🎨</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" class="subtitle-text">
      Digital Sculpting Suites • High-Poly Detailing • Voxel &amp; CAD Workflows
    </text>

    <!-- Dynamic Feature Pills (Clean Foreground Layer) -->
    <g transform="translate(0, 235)" class="pill-float-2">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#10b981" />
        <text x="28" y="22" class="badge-text">ZBrush &amp; Mudbox</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#3b82f6" />
        <text x="28" y="22" class="badge-text">Blender Sculpt</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(289, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#f59e0b" />
        <text x="28" y="22" class="badge-text">Nomad &amp; Voxel</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(431, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#ec4899" />
        <text x="28" y="22" class="badge-text">Open-Source Engines</text>
      </g>
    </g>
  </g>

  <!-- Subtle Border Rim -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
</svg>
